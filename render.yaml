services:
  - type: web
    name: dhyavora-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build --workspace @dhyavora/contracts && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: dhyavora_prod
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: AI_PROVIDER
        value: none
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: PAYMENT_PROVIDER
        value: none
      - key: PAYMENT_KEY_ID
        sync: false
      - key: PAYMENT_KEY_SECRET
        sync: false
      - key: PAYMENT_PRICE_ID
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: none
      - key: EMAIL_API_KEY
        sync: false
      - key: OPPORTUNITY_PROVIDER
        value: none
      - key: OPPORTUNITY_API_KEY
        sync: false
